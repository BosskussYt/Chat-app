<!DOCTYPE html>
<html>
<head>
<title>Discord Clone</title>

<style>
body {
    margin:0;
    display:flex;
    font-family:Arial;
    background:#313338;
    color:white;
}

#sidebar {
    width:220px;
    background:#2b2d31;
    height:100vh;
}

#chat {
    flex:1;
    display:flex;
    flex-direction:column;
}

#messages {
    flex:1;
    padding:10px;
    overflow-y:auto;
}

#input {
    display:flex;
    padding:10px;
}

input {
    flex:1;
    padding:10px;
    border:none;
    background:#1e1f22;
    color:white;
}

button {
    padding:10px;
    background:#5865F2;
    border:none;
    color:white;
}
</style>

</head>

<body>

<div id="sidebar">
<h3>Rooms</h3>
<button onclick="setRoom('general')"># general</button>
<button onclick="setRoom('random')"># random</button>
</div>

<div id="chat">

<div id="messages"></div>

<div id="input">
<input id="msg">
<button onclick="send()">Send</button>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
let socket = io();

let user = "{{user}}";
let room = "general";

socket.emit("join", {room});

socket.on("message", (data) => {
    document.getElementById("messages").innerHTML +=
    `<div><b>${data.user}:</b> ${data.msg}</div>`;
});

function send() {
    let msg = document.getElementById("msg").value;

    socket.send({
        user,
        room,
        msg
    });

    document.getElementById("msg").value = "";
}

function setRoom(r) {
    room = r;
    document.getElementById("messages").innerHTML = "";
    socket.emit("join", {room});
}
</script>

</body>
</html>
