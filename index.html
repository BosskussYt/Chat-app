<!DOCTYPE html>
<html>
<head>
<title>Discord Clone</title>

<style>
body {
    margin:0;
    display:flex;
    font-family:Arial;
    background:#313338;
    color:white;
}

/* servers */
#servers {
    width:70px;
    background:#1e1f22;
    height:100vh;
}

/* channels */
#channels {
    width:220px;
    background:#2b2d31;
    height:100vh;
}

/* chat */
#chat {
    flex:1;
    display:flex;
    flex-direction:column;
}

#messages {
    flex:1;
    padding:10px;
    overflow-y:scroll;
}

#input {
    display:flex;
    padding:10px;
    background:#2b2d31;
}

input {
    flex:1;
    padding:10px;
    border:none;
    background:#1e1f22;
    color:white;
}

button {
    padding:10px;
    background:#5865F2;
    border:none;
    color:white;
}
</style>
</head>

<body>

<div id="servers"></div>
<div id="channels"></div>

<div id="chat">

<div id="messages"></div>

<div id="input">
<input id="msg">
<button onclick="send()">Send</button>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
let socket = io();

let user = "{{user}}";
let room = "general";

socket.emit("join", {room});

socket.on("message", (d) => {
    document.getElementById("messages").innerHTML +=
    "<div><b>" + d.user + ":</b> " + d.msg + "</div>";
});

function send() {
    let msg = document.getElementById("msg").value;

    socket.send({
        user,
        room,
        msg
    });

    document.getElementById("msg").value = "";
}
</script>

</body>
</html>
